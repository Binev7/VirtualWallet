<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Забравена парола - Virtual Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config = { theme: { extend: { colors: { primary: '#4A148C', secondary: '#7B1FA2' } } } }</script>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-900 flex items-center justify-center min-h-screen">
<main class="w-full max-w-md bg-white min-h-screen p-8 shadow-xl flex flex-col justify-center relative">
    <a th:href="@{/login}" class="absolute top-6 left-6 text-gray-400 hover:text-gray-800"><i class="fas fa-arrow-left text-xl"></i></a>

    <div class="text-center mb-8">
        <div class="bg-gray-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-primary text-2xl"><i class="fas fa-key"></i></div>
        <h1 class="text-2xl font-bold text-gray-800">Forgot Password?</h1>
        <p class="text-gray-500 mt-2 text-sm">Enter your email and we'll send you a link to reset your password.</p>
    </div>

    <div th:if="${successMessage}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4">
        <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4">
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/forgot-password}" method="post" class="space-y-6">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
            <input type="email" name="email" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-primary focus:border-transparent transition">
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-primary to-secondary text-white font-bold py-3 px-4 rounded-full shadow-lg hover:shadow-xl transition-all">
            Send Reset Link
        </button>
    </form>
</main>
</body>
</html>
