<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Възстановяване - Virtual Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config = { theme: { extend: { colors: { primary: '#4A148C', secondary: '#7B1FA2' } } } }</script>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-900 flex items-center justify-center min-h-screen">
<main class="w-full max-w-md bg-white min-h-screen p-8 shadow-xl flex flex-col justify-center relative">

    <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-gray-800">Set New Password</h1>
        <p class="text-gray-500 mt-2 text-sm">Please enter your new password below.</p>
    </div>

    <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4">
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/reset-password}" method="post" class="space-y-6">
        <input type="hidden" name="token" th:value="${token}">

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
            <input type="password" name="newPassword" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-primary focus:border-transparent transition">
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-primary to-secondary text-white font-bold py-3 px-4 rounded-full shadow-lg hover:shadow-xl transition-all">
            Reset Password
        </button>
    </form>
</main>
</body>
</html>
