<!DOCTYPE html>
<html lang="bg"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout/base}">
<body class="bg-gray-100 font-sans antialiased text-gray-900">

<main layout:fragment="content" class="max-w-md mx-auto p-4 pb-24">

    <div class="flex justify-between items-center mb-8 mt-4">
        <h1 class="text-2xl font-bold text-gray-800 tracking-tight">My Wallets</h1>
        <a th:href="@{/wallets/new}" class="w-12 h-12 bg-[#4A148C] text-white rounded-2xl flex items-center justify-center shadow-lg hover:bg-[#310d5e] transition-all transform hover:scale-105">
            <i class="fas fa-plus text-lg"></i>
        </a>
    </div>

    <div th:replace="~{fragments/alerts :: success}"></div>
    <div th:replace="~{fragments/alerts :: error}"></div>

    <div class="space-y-5">
        <div th:each="w : ${wallets}"
             class="bg-gradient-to-br from-[#4A148C] to-[#7B1FA2] p-7 rounded-[2rem] text-white shadow-2xl relative overflow-hidden transition-transform active:scale-95">

            <div class="relative z-10">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <p class="text-xs font-medium opacity-70 uppercase tracking-widest" th:text="${w.name}">Main Wallet</p>
                            <span th:if="${w.isJoint}" class="bg-white/20 text-[9px] px-1.5 py-0.5 rounded uppercase font-bold">Joint</span>
                        </div>
                    </div>

                    <div class="flex gap-2">
                        <th:block th:if="${w.isOwner}">
                            <a th:href="@{/wallets/{id}/edit(id=${w.id})}"
                               class="w-8 h-8 flex items-center justify-center bg-white/20 hover:bg-white/30 rounded-xl transition-colors">
                                <i class="fas fa-edit text-xs"></i>
                            </a>

                            <a th:href="@{/wallets/{id}/members(id=${w.id})}"
                               class="w-8 h-8 flex items-center justify-center bg-white/20 hover:bg-white/30 rounded-xl transition-colors">
                                <i class="fas fa-users text-xs"></i>
                            </a>

                            <form th:action="@{/wallets/{id}/delete(id=${w.id})}"
                                  method="post"
                                  th:onsubmit="return confirm([[${T(com.portfolio.virtualwallet.controller.mvc.constants.MvcConstants$Messages).CONFIRM_DELETE}]]);">

                                <button type="submit" class="w-8 h-8 flex items-center justify-center bg-red-500/30 hover:bg-red-500/50 rounded-xl transition-colors">
                                    <i class="fas fa-trash text-xs"></i>
                                </button>
                            </form>
                        </th:block>

                        <div th:if="${!w.isOwner}" class="w-8 h-8 flex items-center justify-center bg-white/10 rounded-xl opacity-60">
                            <i class="fas fa-handshake text-[10px]"></i>
                        </div>
                    </div>
                </div>

                <div class="mb-10">
                    <p class="text-[10px] opacity-60 mb-1 font-medium tracking-wide">Available Balance</p>
                    <h2 class="text-4xl font-bold tracking-tight" th:text="'$' + ${#numbers.formatDecimal(w.balance, 1, 2)}">$0.00</h2>
                </div>

                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-2 opacity-50">
                        <i th:class="${w.isDefault} ? 'fas fa-star text-[10px]' : ''"></i>
                        <span th:if="${w.isDefault}" class="text-[9px] uppercase font-bold tracking-tighter">Primary Wallet</span>
                    </div>

                    <div class="w-10 h-6 bg-white/10 rounded-lg flex items-center justify-center">
                        <i class="fas fa-wallet text-xs opacity-40"></i>
                    </div>
                </div>
            </div>

            <div class="absolute -right-8 -bottom-8 w-32 h-32 bg-white/5 rounded-full blur-2xl"></div>
            <div class="absolute -left-4 -top-4 w-24 h-24 bg-white/5 rounded-full blur-xl"></div>
        </div>
    </div>

    <div th:if="${wallets.isEmpty()}" class="mt-20 text-center px-10">
        <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4 text-gray-300">
            <i class="fas fa-folder-open text-3xl"></i>
        </div>
        <h3 class="text-gray-500 font-bold">No wallets found</h3>
    </div>

</main>
</body>
</html>
