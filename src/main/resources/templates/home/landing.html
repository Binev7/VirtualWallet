<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Wallet - The Future of Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        @keyframes float-delayed {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-blob { animation: blob 7s infinite; }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }
        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-float-delayed { animation: float-delayed 5s ease-in-out infinite 2s; }
        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-900 flex justify-center min-h-screen">

<main class="w-full max-w-md bg-[#fafafa] min-h-screen relative overflow-hidden flex flex-col shadow-2xl">

    <div class="absolute top-0 -left-4 w-72 h-72 bg-purple-300 rounded-full mix-blend-multiply filter blur-2xl opacity-50 animate-blob"></div>
    <div class="absolute top-20 -right-4 w-72 h-72 bg-pink-300 rounded-full mix-blend-multiply filter blur-2xl opacity-50 animate-blob animation-delay-2000"></div>
    <div class="absolute -bottom-8 left-20 w-72 h-72 bg-indigo-300 rounded-full mix-blend-multiply filter blur-2xl opacity-50 animate-blob animation-delay-4000"></div>

    <div class="relative z-10 flex flex-col h-full px-8 py-8 justify-between min-h-screen">

        <div class="animate-[fadeInUp_1s_ease-out] mt-12 relative z-20 flex flex-col items-center">
            <div class="w-16 h-16 bg-white/60 backdrop-blur-xl border border-white/60 rounded-2xl shadow-lg flex items-center justify-center mb-6 transform -rotate-6">
                <i class="fas fa-wallet text-3xl text-transparent bg-clip-text bg-gradient-to-br from-[#4A148C] to-[#7B1FA2] transform rotate-6"></i>
            </div>

            <h1 class="text-6xl leading-[1.05] font-black tracking-tight text-gray-900 mb-4 text-center">
                Smart<br>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#4A148C] to-[#7B1FA2]">Finance.</span>
            </h1>

            <p class="text-gray-500 text-sm leading-relaxed max-w-sm font-medium mb-6 text-center">
                Experience the next generation of digital banking. Secure, fast, and entirely yours.
            </p>

        </div>

        <div class="flex-1 flex items-center justify-center relative w-full my-4">

            <div class="relative z-20 w-full max-w-[280px] h-[170px] bg-white/40 backdrop-blur-xl rounded-[2rem] border border-white/60 shadow-[0_20px_40px_-15px_rgba(74,20,140,0.2)] p-6 flex flex-col justify-between animate-float overflow-hidden">
                <div class="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 bg-gradient-to-br from-white/80 to-transparent rounded-full blur-xl"></div>

                <div class="flex justify-between items-start relative z-10">
                    <div class="w-10 h-7 bg-gradient-to-br from-yellow-200 to-yellow-400 rounded border border-yellow-100/50 flex items-center justify-center opacity-80">
                        <i class="fas fa-microchip text-yellow-700/50 text-xs"></i>
                    </div>
                    <div class="flex space-x-1">
                        <div class="w-6 h-6 rounded-full bg-red-500/80 mix-blend-multiply"></div>
                        <div class="w-6 h-6 rounded-full bg-orange-400/80 mix-blend-multiply -ml-3"></div>
                    </div>
                </div>

                <div class="relative z-10">
                    <p class="text-[10px] text-gray-600 font-bold uppercase tracking-widest mb-1">Total Balance</p>
                    <p class="text-3xl font-black text-gray-800 tracking-tight">$12,450<span class="text-xl text-gray-500 font-bold">.00</span></p>
                </div>
            </div>

            <div class="absolute -right-4 -top-6 z-10 w-[140px] bg-white/60 backdrop-blur-md rounded-2xl border border-white/60 shadow-lg p-3 flex items-center gap-3 animate-float-delayed">
                <div class="w-8 h-8 rounded-full bg-green-100 flex items-center justify-center text-green-500 shrink-0">
                    <i class="fas fa-arrow-up text-xs"></i>
                </div>
                <div>
                    <p class="text-[9px] text-gray-500 font-bold uppercase tracking-wider">Received</p>
                    <p class="text-sm font-black text-gray-800">+$250.00</p>
                </div>
            </div>

        </div>

        <div class="space-y-3 mt-auto mb-16 relative z-20">
            <a th:href="@{/register}" class="group relative w-full flex justify-center py-4 px-4 border border-transparent text-sm font-bold rounded-2xl text-white bg-gradient-to-r from-[#4A148C] to-[#7B1FA2] shadow-lg shadow-purple-900/20 hover:shadow-xl hover:shadow-purple-900/40 transition-all duration-300 overflow-hidden">
                <div class="absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-white/20 to-transparent group-hover:animate-[shimmer_1.5s_infinite]"></div>
                <span class="relative z-10 flex items-center gap-2">
                        Get Started <i class="fas fa-arrow-right transform group-hover:translate-x-1 transition-transform"></i>
                    </span>
            </a>

            <a th:href="@{/login}" class="w-full flex justify-center py-4 px-4 border border-white/60 text-sm font-bold rounded-2xl text-gray-700 bg-white/40 backdrop-blur-md hover:bg-white hover:border-white transition-all duration-300 shadow-sm hover:shadow-md">
                I already have an account
            </a>
        </div>

    </div>
</main>

</body>
</html>
