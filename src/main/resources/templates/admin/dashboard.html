<!DOCTYPE html>
<html lang="bg"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout/base}">
<body class="bg-gray-100 font-sans antialiased text-gray-900">

<main layout:fragment="content" class="max-w-md mx-auto bg-gray-50 min-h-screen p-4 shadow-xl pb-24">

    <div class="flex items-center justify-between mb-8 mt-2 sticky top-0 bg-gray-50/95 backdrop-blur z-10 py-3">
        <div class="flex items-center">
            <a th:href="@{/}" class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm text-gray-600 hover:bg-gray-100 transition">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h1 class="text-xl font-bold ml-4 text-gray-800">Admin Dashboard</h1>
        </div>
    </div>

    <div class="mb-8 px-2">
        <h2 class="text-2xl font-bold text-gray-900">Welcome, Admin</h2>
        <p class="text-sm text-gray-500 mt-1">What would you like to manage today?</p>
    </div>

    <div class="space-y-4">

        <a th:href="@{/admin/users}"
           class="block bg-white p-6 rounded-3xl shadow-sm border border-gray-100 hover:shadow-md hover:border-purple-200 transition-all group">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 bg-purple-50 rounded-2xl flex items-center justify-center text-purple-600 group-hover:bg-purple-600 group-hover:text-white transition-colors">
                    <i class="fas fa-users text-2xl"></i>
                </div>
                <div class="flex-1">
                    <h3 class="text-lg font-bold text-gray-800">Manage Users</h3>
                    <p class="text-xs text-gray-400 mt-1">Block, unblock and search users</p>
                </div>
                <i class="fas fa-chevron-right text-gray-300 group-hover:text-purple-600 transition-colors"></i>
            </div>
        </a>

        <a th:href="@{/admin/transactions}"
           class="block bg-white p-6 rounded-3xl shadow-sm border border-gray-100 hover:shadow-md hover:blue-purple-200 transition-all group">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 bg-blue-50 rounded-2xl flex items-center justify-center text-blue-500 group-hover:bg-blue-500 group-hover:text-white transition-colors">
                    <i class="fas fa-exchange-alt text-2xl"></i>
                </div>
                <div class="flex-1">
                    <h3 class="text-lg font-bold text-gray-800">All Transactions</h3>
                    <p class="text-xs text-gray-400 mt-1">View global transaction history</p>
                </div>
                <i class="fas fa-chevron-right text-gray-300 group-hover:text-blue-500 transition-colors"></i>
            </div>
        </a>

    </div>

</main>
</body>
</html>
