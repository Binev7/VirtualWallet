<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Email Verification</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
<div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
    <h2 style="color: #333333; text-align: center;">Welcome to Virtual Wallet!</h2>
    <p style="color: #555555; font-size: 16px; line-height: 1.5;">Hello,</p>
    <p style="color: #555555; font-size: 16px; line-height: 1.5;">Thank you for registering. Please confirm your email address to activate your account and start making transactions.</p>

    <div style="text-align: center; margin: 30px 0;">
        <a th:href="${confirmationUrl}" style="background-color: #007bff; color: #ffffff; padding: 12px 24px; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 16px; display: inline-block;">Verify Email</a>
    </div>

    <p style="color: #999999; font-size: 14px; text-align: center;">This link will expire in 24 hours. If you did not create an account, no further action is required.</p>
</div>
</body>
</html>
