<!DOCTYPE html>
<html lang="bg"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout/base}">
<body class="bg-gray-100 font-sans antialiased text-gray-900">

<main layout:fragment="content" class="max-w-md mx-auto bg-gray-50 min-h-screen p-4 shadow-xl pb-24">

    <div class="flex items-center justify-between mb-8 mt-2">
        <div class="flex items-center">
            <a th:href="@{/}" class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm text-gray-600 hover:bg-gray-100 transition">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h1 class="text-xl font-bold ml-4">My Profile</h1>
        </div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="w-10 h-10 rounded-full bg-red-50 text-red-500 flex items-center justify-center shadow-sm hover:bg-red-100 transition">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </form>
    </div>

    <div th:replace="~{fragments/alerts :: success}"></div>
    <div th:replace="~{fragments/alerts :: error}"></div>

    <div class="bg-gradient-to-br from-[#4A148C] to-[#7B1FA2] p-6 rounded-[2rem] text-white shadow-xl relative overflow-hidden mb-8">
        <div class="relative z-10 flex items-center gap-5">
            <div class="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center text-2xl font-bold uppercase border-2 border-white/30"
                 th:text="${#strings.substring(currentUser.username, 0, 1)}">
                U
            </div>

            <div>
                <h2 class="text-2xl font-bold tracking-tight" th:text="${currentUser.username}">Username</h2>

                <div class="mt-3 flex gap-2">
                    <span class="text-[10px] bg-green-500/30 text-green-100 px-2 py-1 rounded-lg uppercase font-bold tracking-wider border border-green-400/30 flex items-center gap-1">
                        <i class="fas fa-check-circle"></i> Active
                    </span>
                    <span th:if="${currentUser.isEmailVerified}" class="text-[10px] bg-blue-500/30 text-blue-100 px-2 py-1 rounded-lg uppercase font-bold tracking-wider border border-blue-400/30 flex items-center gap-1">
                        <i class="fas fa-envelope-open"></i> Verified
                    </span>
                </div>
            </div>
        </div>

        <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white/5 rounded-full blur-2xl"></div>
        <div class="absolute -left-5 -top-5 w-20 h-20 bg-white/5 rounded-full blur-xl"></div>
    </div>

    <h3 class="text-sm font-bold text-gray-800 uppercase tracking-wide mb-4 px-2">Account Settings</h3>

    <div class="mb-6">
        <form th:action="@{/profile/change-email}" th:object="${changeEmailDto}" method="post">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex items-center justify-between mb-3">
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide">Email Address</label>
                    <i class="fas fa-envelope text-[#4A148C] opacity-50"></i>
                </div>

                <p class="text-xs text-gray-400 mb-3">Current: <span class="font-medium text-gray-700" th:text="${currentUser.email}">user@email.com</span></p>

                <div class="space-y-3">
                    <input type="email" th:field="*{newEmail}" required
                           placeholder="Enter new email address"
                           class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#4A148C] outline-none transition-all text-sm">
                    <p th:if="${#fields.hasErrors('newEmail')}" th:errors="*{newEmail}" class="text-red-500 text-[10px] ml-1"></p>

                    <button type="submit" class="w-full bg-gray-900 text-white font-bold py-3 rounded-xl shadow-md hover:bg-gray-800 transition-all text-sm">
                        Update Email
                    </button>
                </div>
            </div>
        </form>
    </div>

    <div class="mb-6">
        <form th:action="@{/profile/change-phone}" th:object="${changePhoneDto}" method="post">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex items-center justify-between mb-3">
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide">Phone Number</label>
                    <i class="fas fa-phone-alt text-[#4A148C] opacity-50"></i>
                </div>

                <p class="text-xs text-gray-400 mb-3">Current: <span class="font-medium text-gray-700" th:text="${currentUser.phoneNumber}">+0000000000</span></p>

                <div class="space-y-3">
                    <input type="text" th:field="*{newPhoneNumber}" required
                           placeholder="Enter 10-digit phone number"
                           class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#4A148C] outline-none transition-all text-sm">
                    <p th:if="${#fields.hasErrors('newPhoneNumber')}" th:errors="*{newPhoneNumber}" class="text-red-500 text-[10px] ml-1"></p>

                    <button type="submit" class="w-full bg-gray-900 text-white font-bold py-3 rounded-xl shadow-md hover:bg-gray-800 transition-all text-sm">
                        Update Phone
                    </button>
                </div>
            </div>
        </form>
    </div>

    <div class="mb-8">
        <form th:action="@{/profile/change-password}" th:object="${changePasswordDto}" method="post">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex items-center justify-between mb-4">
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide">Security & Password</label>
                    <i class="fas fa-lock text-[#4A148C] opacity-50"></i>
                </div>

                <div class="space-y-3">
                    <div>
                        <input type="password" th:field="*{currentPassword}" required
                               placeholder="Current Password"
                               class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#4A148C] outline-none transition-all text-sm">
                        <p th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}" class="text-red-500 text-[10px] ml-1 mt-1"></p>
                    </div>

                    <div>
                        <input type="password" th:field="*{newPassword}" required
                               placeholder="New Password"
                               class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#4A148C] outline-none transition-all text-sm">
                        <p th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="text-red-500 text-[10px] ml-1 mt-1"></p>
                    </div>

                    <div>
                        <input type="password" th:field="*{confirmPassword}" required
                               placeholder="Confirm New Password"
                               class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#4A148C] outline-none transition-all text-sm">
                        <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="text-red-500 text-[10px] ml-1 mt-1"></p>
                    </div>

                    <button type="submit" class="w-full bg-[#4A148C] text-white font-bold py-3 rounded-xl shadow-md hover:bg-[#7B1FA2] transition-all text-sm mt-2">
                        Change Password
                    </button>
                </div>
            </div>
        </form>
    </div>

    <div class="bg-purple-50 p-5 rounded-2xl border border-purple-100 flex gap-4 items-start mb-6">
        <div class="w-8 h-8 bg-purple-200 rounded-full flex items-center justify-center text-[#4A148C] shrink-0">
            <i class="fas fa-shield-alt text-xs"></i>
        </div>
        <div>
            <h4 class="text-xs font-bold text-gray-800">Security Note</h4>
            <p class="text-[10px] text-gray-500 mt-1 leading-relaxed">
                Changing your email address or password may require you to log in again. Ensure you have access to your inbox for future verifications.
            </p>
        </div>
    </div>

</main>
</body>
</html>
