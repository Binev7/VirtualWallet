<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="mobile-nav"
     class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white rounded-t-3xl shadow-[0_-5px_15px_rgba(0,0,0,0.05)] px-6 py-3 z-50">
    <ul class="flex justify-between items-center text-gray-400">
        <li class="flex flex-col items-center cursor-pointer text-[#4A148C]">
            <i class="fas fa-home text-xl mb-1"></i>
        </li>
        <li class="flex flex-col items-center cursor-pointer hover:text-[#4A148C] transition-colors">
            <i class="fas fa-file-invoice-dollar text-xl mb-1"></i>
        </li>
        <li class="relative -top-5">
            <div class="bg-black text-white rounded-full w-14 h-14 flex items-center justify-center shadow-lg cursor-pointer">
                <i class="fas fa-qrcode text-2xl"></i>
            </div>
        </li>
        <li class="flex flex-col items-center cursor-pointer hover:text-[#4A148C] transition-colors">
            <i class="fas fa-credit-card text-xl mb-1"></i>
        </li>
        <li class="flex flex-col items-center cursor-pointer hover:text-[#4A148C] transition-colors">
            <i class="fas fa-user text-xl mb-1"></i>
        </li>
    </ul>
</div>
</body>
</html>
