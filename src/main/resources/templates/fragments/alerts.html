<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="success" th:if="${successMessage}"
     class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-2xl relative mb-6 text-sm text-center shadow-sm animate-fade-in-down">
    <div class="flex items-center justify-center gap-2">
        <i class="fas fa-check-circle"></i>
        <span class="font-medium" th:text="${successMessage}">Success!</span>
    </div>
</div>

<div th:fragment="error" th:if="${error}"
     class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-2xl relative mb-6 text-sm text-center shadow-sm animate-fade-in-down">
    <div class="flex items-center justify-center gap-2">
        <i class="fas fa-exclamation-circle"></i>
        <span class="font-medium" th:text="${error}">Error!</span>
    </div>
</div>

</body>
</html>
