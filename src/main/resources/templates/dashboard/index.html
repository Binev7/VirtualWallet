<!DOCTYPE html>
<html lang="bg"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout/base}">
<body class="bg-gray-100 font-sans antialiased text-gray-900">

<main layout:fragment="content" class="max-w-md mx-auto bg-gray-50 min-h-screen p-4 shadow-xl pb-24">

    <div class="flex justify-between items-center mb-6">
        <div class="flex items-center gap-3">
            <img th:src="@{'https://ui-avatars.com/api/?name=' + ${currentUser.username} + '&background=4A148C&color=fff'}"
                 alt="User" class="w-12 h-12 rounded-full border-2 border-white shadow-sm">
            <div>
                <p class="text-xs text-gray-500">Welcome back!</p>
                <h1 class="text-lg font-bold" th:text="${currentUser.username}">Admiral Sky</h1>
            </div>
        </div>
        <button class="bg-white p-2 rounded-full shadow-sm relative">
            <i class="far fa-bell text-gray-600"></i>
            <span class="absolute top-1 right-1 bg-red-500 w-2 h-2 rounded-full"></span>
        </button>
    </div>

    <div class="bg-gradient-to-r from-[#4A148C] to-[#7B1FA2] rounded-3xl p-6 text-white shadow-lg mb-6 relative overflow-hidden">
        <div class="absolute -right-6 -top-6 w-32 h-32 bg-white opacity-10 rounded-full"></div>

        <p class="text-sm opacity-80 mb-1">Balance</p>
        <h2 class="text-3xl font-bold mb-6">
            $ <span th:text="${wallet != null ? #numbers.formatDecimal(wallet.balance, 1, 'COMMA', 2, 'POINT') : '0.00'}">321.00</span>
        </h2>

        <div class="flex justify-between items-end">
            <p class="text-sm tracking-widest opacity-80">
                **** **** **** <span th:text="${card != null and card.maskedCardNumber != null ? card.maskedCardNumber : '0000'}">4321</span>
            </p>
            <div class="font-bold text-xl italic">VISA</div>
        </div>
    </div>

    <div class="grid grid-cols-4 gap-4 mb-8">
        <a th:href="@{/deposit}" class="flex flex-col items-center gap-2">
            <div class="bg-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-sm text-gray-600 hover:bg-[#4A148C] hover:text-white transition-colors">
                <i class="fas fa-plus"></i>
            </div>
            <span class="text-xs font-medium">Top Up</span>
        </a>
        <a th:href="@{/transfer}" class="flex flex-col items-center gap-2">
            <div class="bg-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-sm text-gray-600 hover:bg-[#4A148C] hover:text-white transition-colors">
                <i class="fas fa-arrow-up"></i>
            </div>
            <span class="text-xs font-medium">Transfer</span>
        </a>
    </div>

    <div>
        <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold text-lg">History Transaction</h3>
            <a th:if="${wallet != null}" th:href="@{/history(walletId=${wallet.id})}" class="text-sm text-[#4A148C] font-semibold">See All</a>
        </div>

        <div th:if="${recentTransactions == null or recentTransactions.isEmpty()}" class="text-center text-gray-500 py-6">
            <i class="fas fa-receipt text-3xl mb-2 opacity-50"></i>
            <p class="text-sm">No recent transactions</p>
        </div>

        <div class="space-y-4" th:if="${recentTransactions != null and !recentTransactions.isEmpty()}">

            <div th:each="tx : ${recentTransactions}" class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm">
                <div class="flex items-center gap-3">

                    <div class="w-10 h-10 rounded-full flex items-center justify-center"
                         th:classappend="${tx.type == 'DEPOSIT' ? 'bg-green-100 text-green-500' : 'bg-red-100 text-red-500'}">
                        <i class="fas" th:classappend="${tx.type == 'DEPOSIT' ? 'fa-arrow-down' : 'fa-arrow-up'}"></i>
                    </div>

                    <div>
                        <p class="font-medium text-sm text-gray-800" th:text="${tx.type}">Deposit</p>
                        <p class="text-xs text-gray-500"
                           th:text="${#temporals.format(tx.date, 'dd MMMM yyyy, HH:mm')}">
                            11 October 2023
                        </p>
                    </div>
                </div>

                <div class="font-bold"
                     th:classappend="${tx.type == 'DEPOSIT' ? 'text-green-500' : 'text-gray-800'}"
                     th:text="${tx.type == 'DEPOSIT' ? '+$' + #numbers.formatDecimal(tx.amount, 1, 'COMMA', 2, 'POINT') : '-$' + #numbers.formatDecimal(tx.amount, 1, 'COMMA', 2, 'POINT')}">
                    -$15.00
                </div>
            </div>

        </div>
    </div>

</main>
</body>
</html>
