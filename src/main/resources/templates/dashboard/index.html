<!DOCTYPE html>
<html lang="bg"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout/base}">
<body class="bg-gray-100 font-sans antialiased text-gray-900">

<main layout:fragment="content" class="max-w-md mx-auto bg-gray-50 min-h-screen p-4 shadow-xl pb-24">

    <div class="flex justify-between items-center mb-6">
        <div class="flex items-center gap-3">
            <img th:src="@{'https://ui-avatars.com/api/?name=' + ${currentUser.username} + '&background=4A148C&color=fff'}"
                 alt="User" class="w-12 h-12 rounded-full border-2 border-white shadow-sm">
            <div>
                <p class="text-xs text-gray-500">Welcome back!</p>
                <h1 class="text-lg font-bold" th:text="${currentUser.username}">Admiral Sky</h1>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/alerts :: success}"></div>
    <div th:replace="~{fragments/alerts :: error}"></div>

    <div id="wallet-carousel" class="cursor-pointer relative group select-none">

        <div class="absolute -top-3 right-4 bg-white text-[#4A148C] text-[10px] font-bold px-3 py-1 rounded-full shadow-md z-20 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
            <i class="fas fa-hand-pointer mr-1"></i> Tap wallet to switch
        </div>

        <div th:each="w, stat : ${wallets}"
             class="wallet-slide bg-gradient-to-r from-[#4A148C] to-[#7B1FA2] rounded-3xl p-6 text-white shadow-lg mb-6 relative overflow-hidden transition-all duration-500 ease-in-out"
             th:classappend="${stat.index == 0} ? 'block opacity-100 scale-100' : 'hidden opacity-0 scale-95'">

            <div class="absolute -right-6 -top-6 w-32 h-32 bg-white opacity-10 rounded-full pointer-events-none"></div>

            <div class="flex justify-between items-start mb-1 relative z-10">
                <p class="text-sm opacity-80" th:text="${w.name}">Main Wallet</p>
                <p class="text-xs opacity-50 font-mono" th:text="${stat.count} + ' / ' + ${wallets.size()}">1 / 2</p>
            </div>

            <h2 class="text-3xl font-bold mb-6 relative z-10">
                $ <span th:text="${#numbers.formatDecimal(w.balance, 1, 'COMMA', 2, 'POINT')}">0.00</span>
            </h2>

            <div class="flex justify-between items-end relative z-10 mt-2 border-t border-white border-opacity-20 pt-4">

                <div th:if="${cards != null and !cards.isEmpty()}" class="w-full">
                    <p class="text-[10px] uppercase tracking-wider opacity-60 mb-1">Active Card</p>
                    <div class="flex justify-between items-center w-full">

                        <div class="relative">
                            <select class="card-selector appearance-none bg-transparent text-sm tracking-widest font-medium text-white focus:outline-none cursor-pointer pr-6">
                                <option th:each="c : ${cards}"
                                        th:value="${c.id}"
                                        th:text="'**** **** ' + ${c.maskedCardNumber}"
                                        class="text-gray-900 text-sm py-2">
                                </option>
                            </select>
                            <i class="fas fa-chevron-down absolute right-1 top-1/2 transform -translate-y-1/2 text-[10px] opacity-70 pointer-events-none"></i>
                        </div>

                        <div class="font-bold text-xl italic">VISA</div>
                    </div>
                </div>

                <div th:unless="${cards != null and !cards.isEmpty()}" class="w-full flex justify-between items-end">
                    <div>
                        <p class="text-[10px] uppercase tracking-wider opacity-60 mb-1">Active Card</p>
                        <p class="text-sm tracking-widest opacity-80">No card linked</p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="flex justify-evenly items-center mb-10 mt-4 px-2">
        <a th:href="@{/deposit}" class="flex flex-col items-center gap-2 group">
            <div class="bg-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-sm text-gray-600 group-hover:bg-[#4A148C] group-hover:text-white transition-colors">
                <i class="fas fa-plus"></i>
            </div>
            <span class="text-xs font-medium">Top Up</span>
        </a>
        <a th:href="@{/withdraw}" class="flex flex-col items-center gap-2 group">
            <div class="bg-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-sm text-gray-600 group-hover:bg-gray-800 group-hover:text-white transition-colors">
                <i class="fas fa-building-columns"></i>
            </div>
            <span class="text-xs font-medium">Withdraw</span>
        </a>
        <a th:href="@{/transfer}" class="flex flex-col items-center gap-2 group">
            <div class="bg-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-sm text-gray-600 group-hover:bg-[#4A148C] group-hover:text-white transition-colors">
                <i class="fas fa-arrow-right-arrow-left"></i>
            </div>
            <span class="text-xs font-medium">Transfer</span>
        </a>
        <a th:href="@{/recurring}" class="flex flex-col items-center group cursor-pointer">
            <div class="w-14 h-14 bg-white rounded-2xl shadow-sm flex items-center justify-center text-gray-800 mb-2 group-hover:shadow-md group-hover:text-[#4A148C] transition-all">
                <i class="fas fa-sync-alt"></i> </div>
            <span class="text-xs font-medium text-gray-600">Auto-Pay</span>
        </a>
    </div>

    <div id="transactions-container">

        <div th:each="walletTxs, stat : ${allRecentTransactions}"
             class="tx-history-slide transition-opacity duration-300"
             th:classappend="${stat.index == 0} ? 'block opacity-100' : 'hidden opacity-0'">

            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg">History Transaction</h3>
                <a th:href="@{/history(walletId=${wallets[stat.index].id})}" class="text-sm text-[#4A148C] font-semibold">See All</a>
            </div>

            <div th:if="${walletTxs.isEmpty()}" class="text-center text-gray-500 py-6">
                <i class="fas fa-receipt text-3xl mb-2 opacity-50"></i>
                <p class="text-sm">No recent transactions</p>
            </div>

            <div class="space-y-4" th:if="${!walletTxs.isEmpty()}">
                <div th:each="tx : ${walletTxs}" class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center"
                             th:classappend="${tx.type == 'DEPOSIT' ? 'bg-green-100 text-green-500' : 'bg-red-100 text-red-500'}">
                            <i class="fas" th:classappend="${tx.type == 'DEPOSIT' ? 'fa-arrow-down' : 'fa-arrow-up'}"></i>
                        </div>
                        <div>
                            <p class="font-medium text-sm text-gray-800" th:text="${tx.type}">Deposit</p>
                            <p class="text-xs text-gray-500" th:text="${#temporals.format(tx.date, 'dd MMMM yyyy, HH:mm')}">11 Oct 2023</p>
                        </div>
                    </div>
                    <div class="font-bold"
                         th:classappend="${tx.type == 'DEPOSIT' ? 'text-green-500' : 'text-gray-800'}"
                         th:text="${tx.type == 'DEPOSIT' ? '+$' + #numbers.formatDecimal(tx.amount, 1, 'COMMA', 2, 'POINT') : '-$' + #numbers.formatDecimal(tx.amount, 1, 'COMMA', 2, 'POINT')}">
                        -$15.00
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const carousel = document.getElementById('wallet-carousel');
            if(!carousel) return;

            const selects = carousel.querySelectorAll('.card-selector');
            selects.forEach(select => {
                select.addEventListener('click', (e) => {
                    e.stopPropagation();
                });
            });

            const slides = carousel.querySelectorAll('.wallet-slide');
            if(slides.length <= 1) return;

            let currentIndex = 0;

            carousel.addEventListener('click', () => {
                slides[currentIndex].classList.remove('block', 'opacity-100', 'scale-100');
                slides[currentIndex].classList.add('hidden', 'opacity-0', 'scale-95');

                currentIndex = (currentIndex + 1) % slides.length;

                slides[currentIndex].classList.remove('hidden', 'opacity-0', 'scale-95');
                slides[currentIndex].classList.add('block', 'opacity-100', 'scale-100');
            });
        });

        document.addEventListener("DOMContentLoaded", () => {
            const carousel = document.getElementById('wallet-carousel');
            if(!carousel) return;

            // Спиране на клика върху селекта с карти
            const selects = carousel.querySelectorAll('.card-selector');
            selects.forEach(select => select.addEventListener('click', e => e.stopPropagation()));

            const slides = carousel.querySelectorAll('.wallet-slide');
            const txSlides = document.querySelectorAll('.tx-history-slide'); // Взимаме блоковете с история

            if(slides.length <= 1) return;

            let currentIndex = 0;

            carousel.addEventListener('click', () => {
                // 1. Скриваме текущия портфейл и неговата история
                slides[currentIndex].classList.remove('block', 'opacity-100', 'scale-100');
                slides[currentIndex].classList.add('hidden', 'opacity-0', 'scale-95');

                if(txSlides[currentIndex]) {
                    txSlides[currentIndex].classList.remove('block', 'opacity-100');
                    txSlides[currentIndex].classList.add('hidden', 'opacity-0');
                }

                // 2. Преминаваме към следващия индекс
                currentIndex = (currentIndex + 1) % slides.length;

                // 3. Показваме новия портфейл и неговата история
                slides[currentIndex].classList.remove('hidden', 'opacity-0', 'scale-95');
                slides[currentIndex].classList.add('block', 'opacity-100', 'scale-100');

                if(txSlides[currentIndex]) {
                    txSlides[currentIndex].classList.remove('hidden', 'opacity-0');
                    txSlides[currentIndex].classList.add('block', 'opacity-100');
                }
            });
        });
    </script>

</main>
</body>
</html>
