<!DOCTYPE html>
<html lang="bg"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout/base}">
<body class="bg-gray-100 font-sans antialiased text-gray-900">

<main layout:fragment="content" class="max-w-md mx-auto bg-gray-50 min-h-screen p-4 shadow-xl pb-24">

    <div class="flex items-center mb-8 mt-2">
        <a th:href="@{/transfer}" class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm text-gray-600 hover:bg-gray-100 transition">
            <i class="fas fa-arrow-left"></i>
        </a>
        <h1 class="text-xl font-bold ml-4">Transfer Amount</h1>
    </div>

    <div th:replace="~{fragments/alerts :: error}"></div>

    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between mb-6">
        <div class="flex items-center gap-4">
            <img th:src="@{'https://ui-avatars.com/api/?name=' + ${receiverName} + '&background=f3f4f6&color=4A148C&rounded=true'}"
                 alt="Avatar" class="w-12 h-12 rounded-full border border-gray-100">
            <div>
                <p class="text-xs text-gray-500 uppercase tracking-wider font-bold mb-1">Sending to</p>
                <p class="font-bold text-gray-800 text-lg" th:text="${receiverName}">Ivan Ivanov</p>
            </div>
        </div>
        <div class="w-10 h-10 bg-green-50 rounded-full flex items-center justify-center text-green-500">
            <i class="fas fa-check"></i>
        </div>
    </div>

    <form th:action="@{/transfer/process(receiverName=${receiverName})}" th:object="${transferRequest}" method="post" class="space-y-6">

        <input type="hidden" th:field="*{receiverWalletId}" />

        <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 text-center relative">
            <p class="text-gray-400 text-sm font-medium mb-2">Enter Amount</p>
            <div class="flex justify-center items-center text-4xl font-bold text-[#4A148C]">
                <span class="mr-2 text-3xl opacity-70">$</span>
                <input type="number" step="0.01" th:field="*{amount}" required placeholder="0.00"
                       class="w-32 bg-transparent border-none focus:ring-0 p-0 text-center placeholder-gray-300">
            </div>

            <p class="text-[10px] text-gray-400 mt-4"><i class="fas fa-shield-alt mr-1"></i> Amounts over $1000 require OTP</p>

            <div class="w-full h-px bg-gray-100 mt-4 absolute bottom-0 left-0"></div>
        </div>

        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-3">From Wallet</label>
            <div class="relative">
                <select th:field="*{senderWalletId}" required class="w-full appearance-none px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#4A148C] outline-none">
                    <option th:each="w : ${wallets}" th:value="${w.id}" th:text="${w.name} + ' (Available: $' + ${w.balance} + ')'"></option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                    <i class="fas fa-chevron-down text-xs"></i>
                </div>
            </div>
        </div>

        <button type="submit" class="w-full bg-[#4A148C] text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-xl hover:bg-[#7B1FA2] transition-all mt-4 relative overflow-hidden group">
            <span class="relative z-10 flex items-center justify-center gap-2">
                Send Money <i class="fas fa-paper-plane"></i>
            </span>
        </button>
    </form>

</main>
</body>
</html>
