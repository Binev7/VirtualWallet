<!DOCTYPE html>
<html lang="bg"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout/base}">
<head>
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-900">

<main layout:fragment="content" class="max-w-md mx-auto bg-gray-50 min-h-screen p-4 shadow-xl pb-24">

    <div class="flex items-center mb-8 mt-2">
        <a th:href="@{/}" class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm text-gray-600 hover:bg-gray-100 transition">
            <i class="fas fa-arrow-left"></i>
        </a>
        <h1 class="text-xl font-bold ml-4">Add New Card</h1>
    </div>

    <div th:replace="~{fragments/alerts :: success}"></div>
    <div th:replace="~{fragments/alerts :: error}"></div>

    <div class="bg-gradient-to-r from-gray-800 to-gray-900 rounded-2xl p-6 text-white shadow-lg mb-8 relative overflow-hidden h-48 flex flex-col justify-between">
        <div class="absolute -right-6 -top-6 w-32 h-32 bg-white opacity-5 rounded-full"></div>
        <div class="flex justify-between items-center">
            <i class="fas fa-microchip text-3xl text-yellow-400 opacity-80"></i>
            <i class="fab fa-cc-visa text-4xl opacity-80"></i>
        </div>
        <div>
            <p class="text-sm tracking-widest opacity-80 mb-1">Secure Card</p>
            <p class="text-xl tracking-widest font-mono">Protected by Stripe</p>
        </div>
    </div>

    <form id="payment-form" th:action="@{/cards/add}" th:object="${card}" method="post" class="space-y-5 bg-white p-6 rounded-3xl shadow-sm border border-gray-100">

        <div>
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Card Holder Name</label>
            <input type="text" id="cardHolder" th:field="*{cardHolder}" required placeholder="John Doe"
                   class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-[#4A148C] focus:border-transparent transition bg-gray-50">
        </div>

        <div>
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Card Details</label>
            <div id="card-element" class="w-full px-4 py-3 rounded-xl border border-gray-200 transition bg-gray-50" style="min-height: 48px; padding-top: 14px;">
            </div>

            <div id="card-errors" class="text-red-500 text-xs font-bold mt-2 hidden"></div>
        </div>

        <input type="hidden" id="stripePaymentMethodId" th:field="*{stripePaymentMethodId}">

        <button type="submit" id="submit-button" class="w-full mt-6 bg-[#4A148C] text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-xl transition-all">
            Save Securely
        </button>
    </form>

    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function() {
            var stripePublicKey = /*[[${stripePublicKey}]]*/ 'pk_test_...';
            var stripe = Stripe(stripePublicKey);
            var elements = stripe.elements();

            var style = {
                base: {
                    color: '#111827',
                    fontFamily: '"Inter", ui-sans-serif, system-ui, sans-serif',
                    fontSmoothing: 'antialiased',
                    fontSize: '16px',
                    '::placeholder': {
                        color: '#9CA3AF'
                    }
                },
                invalid: {
                    color: '#EF4444',
                    iconColor: '#EF4444'
                }
            };

            var cardElement = elements.create('card', {
                style: style,
                hidePostalCode: true
            });
            cardElement.mount('#card-element');

            var form = document.getElementById('payment-form');
            var submitButton = document.getElementById('submit-button');
            var errorElement = document.getElementById('card-errors');

            form.addEventListener('submit', function(event) {
                event.preventDefault();

                submitButton.disabled = true;
                submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
                errorElement.classList.add('hidden');

                var cardHolderName = document.getElementById('cardHolder').value;

                stripe.createPaymentMethod({
                    type: 'card',
                    card: cardElement,
                    billing_details: {
                        name: cardHolderName
                    }
                }).then(function(result) {
                    if (result.error) {
                        errorElement.textContent = result.error.message;
                        errorElement.classList.remove('hidden');

                        submitButton.disabled = false;
                        submitButton.innerHTML = 'Save Securely';
                    } else {
                        document.getElementById('stripePaymentMethodId').value = result.paymentMethod.id;
                        form.submit();
                    }
                });
            });
        });
    </script>
</main>
</body>
</html>
